<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're in | Beacon</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap">
<style>
  *, *::before, *::after { box-sizing:border-box; }
  :root { --page:#F2F4F6; --ink:#0B0C0E; --ink2:#3F444B; --lime:#B5F000; --lime2:#9EE000; color-scheme: light; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:0 16px; background:var(--page); color:var(--ink);
         font:15px/1.5 Inter, -apple-system, system-ui, sans-serif; }
  .card { width:100%; max-width:456px; padding:40px 28px; border-radius:28px; background:#fff; text-align:center;
          box-shadow:0 1px 2px rgba(10,20,30,.04), 0 24px 60px -20px rgba(10,20,30,.14); }
  .check { width:56px; height:56px; margin:0 auto 16px; border-radius:50%; background:var(--lime); display:grid; place-items:center; }
  .check svg { width:26px; height:26px; }
  h1 { margin:0 0 6px; font-size:26px; font-weight:800; letter-spacing:-0.02em; }
  p { margin:0 0 24px; color:var(--ink2); }
  a { display:inline-flex; align-items:center; justify-content:center; width:100%; height:44px; border-radius:12px; text-decoration:none;
      background:linear-gradient(90deg, var(--lime), var(--lime2)); color:var(--ink); font-weight:700; }
</style>
</head>
<body>
  <main class="card">
    <div class="check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#0B0C0E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>You're in.</h1>
    <p>We'll email you updates and when Beacon opens in your city.</p>
    <a href="/">Get your invite link</a>
  </main>
</body>
</html>
